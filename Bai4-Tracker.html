<title>Bảng điều khiển Bài 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   DESIGN PLAN
   Direction: bảng vẽ kỹ thuật — giấy canh cool-grey, mực graphite,
   một màu cobalt duy nhất cho tương tác; mã công việc (T1.4, NR-3, S13)
   đặt trong mono như chú thích bản vẽ.
   Palette : --bg / --surface / --ink / --line / --accent + 5 màu người
   Type    : Be Vietnam Pro (tiêu đề, Việt) · Manrope (thân, Việt)
             IBM Plex Mono (mã & số liệu)
   Layout  : header dính + dải tab + panel; bảng rộng tự cuộn
   --------------------------------------------------------------- */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#EDEFF4; --surface-3:#E4E8EF;
  --ink:#14161C; --ink-2:#545B6B; --ink-3:#858C9C;
  --line:#DBDFE8; --line-2:#E9ECF2;
  --accent:#2A46C8; --accent-ink:#FFFFFF; --accent-soft:#E5E9FB;
  --ok:#1B7350; --ok-soft:#DFF1E7;
  --warn:#8A5906; --warn-soft:#FAEFD9;
  --danger:#AC2318; --danger-soft:#FAE5E3;
  --p-vong:#2A46C8; --p-bao:#0E7C6B; --p-tin:#6D3FA6; --p-khoa:#9B2D7A; --p-khang:#A6521E;
  --shadow:0 1px 2px rgba(20,22,28,.06), 0 4px 12px rgba(20,22,28,.05);
  --r:10px; --r-sm:6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F14; --surface:#151822; --surface-2:#1B1F2B; --surface-3:#232836;
    --ink:#E9EBF1; --ink-2:#A4ABBC; --ink-3:#767D8E;
    --line:#272C39; --line-2:#1F242F;
    --accent:#8FA4FF; --accent-ink:#0D0F14; --accent-soft:#1B2340;
    --ok:#5FC98F; --ok-soft:#11291D;
    --warn:#E0AC5A; --warn-soft:#2A2113;
    --danger:#F08A82; --danger-soft:#2E1512;
    --p-vong:#8FA4FF; --p-bao:#5BC9B6; --p-tin:#B392E8; --p-khoa:#E58FCB; --p-khang:#E8A176;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#151822; --surface-2:#1B1F2B; --surface-3:#232836;
  --ink:#E9EBF1; --ink-2:#A4ABBC; --ink-3:#767D8E;
  --line:#272C39; --line-2:#1F242F;
  --accent:#8FA4FF; --accent-ink:#0D0F14; --accent-soft:#1B2340;
  --ok:#5FC98F; --ok-soft:#11291D;
  --warn:#E0AC5A; --warn-soft:#2A2113;
  --danger:#F08A82; --danger-soft:#2E1512;
  --p-vong:#8FA4FF; --p-bao:#5BC9B6; --p-tin:#B392E8; --p-khoa:#E58FCB; --p-khang:#E8A176;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{padding-inline:16px; padding-block:0 48px; max-width:1180px; margin:0 auto}
h1,h2,h3,h4{font-family:"Be Vietnam Pro","Manrope",sans-serif; text-wrap:balance; margin:0; line-height:1.25}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.masthead{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.masthead-in{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:10px;
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.mh-title{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1 1 200px}
.mh-title h1{font-size:15px; font-weight:700; letter-spacing:-.01em}
.mh-title p{margin:0; font-size:11.5px; color:var(--ink-2)}
.mh-prog{display:flex; align-items:center; gap:10px; flex:1 1 220px; min-width:0}
.mh-bar{flex:1; height:7px; min-width:80px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:flex}
.mh-bar span{height:100%}
.mh-pct{font-size:15px; font-weight:600; min-width:44px; text-align:right}
.mh-actions{display:flex; gap:6px; flex:0 1 auto}

/* ---------- buttons ---------- */
.btn{
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r-sm);
  padding:6px 11px; white-space:nowrap;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{background:var(--accent); filter:brightness(1.08)}

/* ---------- tabs ---------- */
.tabs{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--mh-h, 54px)); z-index:20;
  background:var(--bg); border-bottom:1px solid var(--line); margin-bottom:18px}
.tabs-in{max-width:1180px; margin:0 auto; padding-inline:16px;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{
  font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  background:none; border:0; border-bottom:2px solid transparent;
  color:var(--ink-2); padding:9px 11px; white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px}
.tab .cnt{font-size:11px; color:var(--ink-3); margin-left:5px}

/* ---------- panels ---------- */
.panel[hidden]{display:none}
.sec{margin-bottom:26px}
.sec-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.sec-h h2{font-size:15px; font-weight:700; letter-spacing:-.01em}
.sec-h .hint{font-size:12px; color:var(--ink-2); margin:0}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px}
.tile .k{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3)}
.tile .v{font-size:23px; font-weight:600; line-height:1.2; margin-top:3px}
.tile .s{font-size:11.5px; color:var(--ink-2); margin-top:1px}
.tile.warn{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 30%, transparent)}
.tile.warn .k{color:var(--warn)}

/* ---------- person rows ---------- */
.plist{display:flex; flex-direction:column; gap:8px}
.prow{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 13px; display:grid; gap:4px 14px;
  grid-template-columns:minmax(150px,1.1fr) minmax(140px,2fr) auto;
  align-items:center;
}
.prow .who{display:flex; align-items:center; gap:8px; min-width:0}
.dot{width:9px; height:9px; border-radius:99px; flex:none}
.pname{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.psub{font-size:11.5px; color:var(--ink-2)}
.pbar{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:flex}
.pbar span{height:100%}
.pstat{font-size:12px; color:var(--ink-2); text-align:right; white-space:nowrap}
@media (max-width:620px){
  .prow{grid-template-columns:1fr; gap:6px}
  .pstat{text-align:left}
}

/* ---------- task tree ---------- */
.grp{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden}
.grp-h{display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--surface-2); border-bottom:1px solid var(--line-2); flex-wrap:wrap}
.grp-h .code{font-size:11.5px; font-weight:600; color:var(--ink-2)}
.grp-h h3{font-size:13.5px; font-weight:600; flex:1 1 auto; min-width:0}
.grp-h .own{font-size:11.5px; color:var(--ink-2); white-space:nowrap}
.grp-meter{height:5px; background:var(--surface-3); display:flex}
.grp-meter span{height:100%}
.tlist{display:flex; flex-direction:column}
.task{
  display:grid; gap:2px 11px; padding:9px 13px;
  grid-template-columns:22px 62px minmax(0,1fr) auto;
  align-items:start; border-top:1px solid var(--line-2);
}
.tlist .task:first-child{border-top:0}
.task:hover{background:var(--surface-2)}
@media (max-width:700px){
  .task{grid-template-columns:22px minmax(0,1fr); }
  .task .tcode{grid-column:2}
  .task .tbody{grid-column:2}
  .task .tmeta{grid-column:2; text-align:left}
}
.mark{
  width:19px; height:19px; margin-top:2px; border-radius:5px; cursor:pointer;
  border:1.5px solid var(--ink-3); background:transparent; padding:0; flex:none;
  display:grid; place-items:center; font-size:11px; line-height:1; color:transparent;
  transition:background .12s, border-color .12s, color .12s;
}
.mark:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.task[data-st="0"] .mark{border-color:var(--ink-3)}
.task[data-st="1"] .mark{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
.task[data-st="2"] .mark{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.mark[data-st="1"]{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
.mark[data-st="2"]{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.task[data-st="2"] .tname{text-decoration:line-through; text-decoration-color:var(--ink-3); color:var(--ink-2)}
.tcode{font-size:11.5px; font-weight:600; color:var(--ink-2); padding-top:1px}
.tname{font-size:13.5px; font-weight:500; min-width:0}
.tdod{font-size:11.5px; color:var(--ink-2); margin-top:1px}
.tmeta{font-size:11.5px; color:var(--ink-2); text-align:right; white-space:nowrap; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:99px; background:var(--surface-3); color:var(--ink-2);
  white-space:nowrap;
}
.chip.p{background:transparent; border:1px solid var(--line); color:var(--ink-2)}
.crit{background:var(--danger-soft); color:var(--danger)}
.dep{font-size:11px; color:var(--ink-3)}

/* ---------- table ---------- */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:560px}
th,td{padding:8px 11px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top}
th{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}

/* ---------- day columns ---------- */
.days{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:9px; overflow-x:auto; padding-bottom:4px}
.day{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 11px; min-width:0}
.day h3{font-size:12.5px; font-weight:700; margin-bottom:2px}
.day .goal{font-size:11px; color:var(--ink-2); margin-bottom:8px; min-height:2.6em}
.day ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.day li{font-size:11.5px; line-height:1.4; display:flex; gap:6px; align-items:flex-start}
.day li::before{content:""; width:5px; height:5px; border-radius:99px; margin-top:6px; flex:none; background:var(--ink-3)}
.day li[data-st="1"]::before{background:var(--warn)}
.day li[data-st="2"]::before{background:var(--ok)}
.day li span{min-width:0}
@media (max-width:900px){ .days{grid-template-columns:repeat(7,minmax(160px,1fr))} }

/* ---------- notes / callouts ---------- */
.note{
  border:1px solid var(--line); border-left:3px solid var(--accent);
  background:var(--surface); border-radius:var(--r-sm);
  padding:11px 13px; font-size:12.5px; color:var(--ink-2);
}
.note.danger{border-left-color:var(--danger)}
.note.warn{border-left-color:var(--warn)}
.note strong{color:var(--ink)}
.note ul{margin:7px 0 0; padding-left:19px}
.note li{margin-bottom:3px}

/* ---------- progress legend ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-bottom:12px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:11px; height:11px; border-radius:3px; border:1.5px solid var(--ink-3)}
.sw.do{border-color:var(--warn); background:var(--warn-soft)}
.sw.dn{border-color:var(--ok); background:var(--ok-soft)}

/* ---------- modal ---------- */
.sheet{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:16px;
  background:rgba(10,12,16,.55)}
.sheet[hidden]{display:none}
.sheet-c{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); width:100%; max-width:520px; padding:18px; display:flex; flex-direction:column; gap:11px;
  max-height:calc(100dvh - 32px); overflow:auto}
.sheet-c h3{font-size:15px}
.sheet-c p{margin:0; font-size:12.5px; color:var(--ink-2)}
textarea{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.5;
  width:100%; min-height:96px; resize:vertical; padding:9px 10px;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-sm);
  word-break:break-all;
}
textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.sheet-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600;
  padding:8px 14px; border-radius:99px; z-index:80; box-shadow:var(--shadow);
}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>

<header class="masthead">
  <div class="masthead-in">
    <div class="mh-title">
      <h1>Bài 4 · Bảng điều khiển nhóm</h1>
      <p>5 thành viên · 7 ngày · 5 deliverable ①–⑤</p>
    </div>
    <div class="mh-prog">
      <div class="mh-bar" id="mhBar" role="img" aria-label="Tiến độ tổng"></div>
      <div class="mh-pct num mono" id="mhPct">0%</div>
    </div>
    <div class="mh-actions">
      <button class="btn" id="btnExport" type="button">Xuất tiến độ</button>
      <button class="btn" id="btnImport" type="button">Nhập</button>
      <button class="btn" id="btnReset" type="button">Đặt lại</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Mục">
  <div class="tabs-in" role="tablist" id="tabbar"></div>
</nav>

<div class="wrap">
  <section class="panel" id="p-over" role="tabpanel" aria-labelledby="t-over"></section>
  <section class="panel" id="p-wbs" role="tabpanel" aria-labelledby="t-wbs" hidden></section>
  <section class="panel" id="p-people" role="tabpanel" aria-labelledby="t-people" hidden></section>
  <section class="panel" id="p-days" role="tabpanel" aria-labelledby="t-days" hidden></section>
  <section class="panel" id="p-nr" role="tabpanel" aria-labelledby="t-nr" hidden></section>
  <section class="panel" id="p-qa" role="tabpanel" aria-labelledby="t-qa" hidden></section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-c" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Mã tiến độ</h3>
    <p id="sheetHint"></p>
    <label class="sr" for="sheetText">Mã tiến độ</label>
    <textarea id="sheetText" spellcheck="false" autocomplete="off"></textarea>
    <div class="sheet-foot">
      <button class="btn" id="sheetClose" type="button">Đóng</button>
      <button class="btn btn-primary" id="sheetAction" type="button">Sao chép</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

const TASKS = [

const KEY = "bai4-tracker-v1";
let state = {};    // { taskId: 0|1|2 }
let nrDone = {};   // { "NR-1": true }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(o && typeof o === "object"){
      state = (o.tasks && typeof o.tasks === "object") ? o.tasks : {};
      nrDone = (o.nr && typeof o.nr === "object") ? o.nr : {};
    }
  }catch(e){ /* chế độ riêng tư / chặn lưu — chạy không lưu */ }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({tasks:state, nr:nrDone})); }
  catch(e){ /* bỏ qua */ }
}
function st(id){ return state[id] ?? 0; }
function cycle(id){ state[id] = (st(id) + 1) % 3; save(); renderAll(); }

  return TASKS.filter(t => t.o === k).reduce((a, t) => a + t.e, 0) + perHeadShared;
}

const NR_H = 0.5;
const loadOf = k => estOf(k) + PEOPLE[k].nrs.length * NR_H;

function progressOf(list){
  let done = 0, doing = 0, total = 0;
  for(const t of list){
    total += t.e;
    const s = st(t.t);
    if(s === 2) done += t.e; else if(s === 1) doing += t.e;
  }
  return {done, doing, total, pct: total ? Math.round(done / total * 100) : 0};
}
function barHtml(p, extraClass){
  const d = p.total ? (p.done / p.total * 100) : 0;
  const g = p.total ? (p.doing / p.total * 100) : 0;
  return `<div class="${extraClass}">` +
    `<span style="width:${d}%;background:var(--ok)"></span>` +
    `<span style="width:${g}%;background:var(--warn)"></span></div>`;
}
function chip(k){ return `<span class="chip p"><span class="dot" style="background:${pcolor(k)}"></span>${esc(pname(k))}</span>`; }

}
function decode(str){
  const s = String(str).trim();
  const m = s.match(/^B4v1:([0-2]+)$/);
  if(!m) return null;
  const digits = m[1];
  if(digits.length !== TASKS.length) return {mismatch:true, digits};
  return {digits};
}
function mergeDigits(digits){
  let changed = 0;
  for(let i = 0; i < TASKS.length && i < digits.length; i++){
    const incoming = Number(digits[i]);
    if(incoming > st(TASKS[i].t)){ state[TASKS[i].t] = incoming; changed++; }
  }
  save();
  return changed;
}

/* ============ SHEET / TOAST ============ */
const sheet = document.getElementById("sheet");
const sheetText = document.getElementById("sheetText");
const sheetHint = document.getElementById("sheetHint");
const sheetAction = document.getElementById("sheetAction");
let sheetMode = "export";

function openSheet(mode){
  sheetMode = mode;
  document.getElementById("sheetTitle").textContent = mode === "export" ? "Mã tiến độ của bạn" : "Dán mã tiến độ";
  sheetHint.textContent = mode === "export"
    ? "Sao chép rồi dán vào nhóm chat. Nhập mã của người khác sẽ gộp tiến độ (lấy mức cao nhất)."
    : "Dán mã B4v1:… của thành viên khác để gộp vào bảng này.";
  sheetText.value = mode === "export" ? encode() : "";
  sheetText.readOnly = mode === "export";
  sheetAction.textContent = mode === "export" ? "Sao chép" : "Gộp vào bảng";
  sheet.hidden = false;
  if(mode === "import") sheetText.focus(); else sheetText.select();
}
function closeSheet(){ sheet.hidden = true; }

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{ sheetText.select(); document.execCommand("copy"); return true; }
    catch(e2){ return false; }
  }
}

/* ============ SỰ KIỆN ============ */
let wbsFilter = {owner:"", hide:false};

function syncTabsTop(){
  const mh = document.querySelector(".masthead");
  if(mh) document.documentElement.style.setProperty("--mh-h", mh.offsetHeight + "px");
}

function renderAll(){
  renderTabs();
  if(activeTab === "over")   renderOver();
  if(activeTab === "wbs")    renderWbs();
  if(activeTab === "people") renderPeople();
  if(activeTab === "days")   renderDays();
  if(activeTab === "nr")     renderNr();
  if(activeTab === "qa")     renderQa();

  // thanh tiến độ trên header
  const p = progressOf(TASKS);
  document.getElementById("mhBar").innerHTML =
    `<span style="width:${p.total ? p.done / p.total * 100 : 0}%;background:var(--ok)"></span>` +
    `<span style="width:${p.total ? p.doing / p.total * 100 : 0}%;background:var(--warn)"></span>`;
  document.getElementById("mhPct").textContent = p.pct + "%";
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){ showTab(tab.dataset.tab); return; }

  const cyc = e.target.closest("[data-cyc]");
  if(cyc){ cycle(cyc.dataset.cyc); return; }

  const nr = e.target.closest("[data-nr]");
  if(nr){
    const id = nr.dataset.nr;
    nrDone[id] = !nrDone[id];
    save();
    renderNr();
    return;
  }
  if(e.target === sheet) closeSheet();
});

document.addEventListener("change", e => {
  if(e.target.id === "fOwner"){ wbsFilter.owner = e.target.value; renderWbs(); }
  if(e.target.id === "fHide"){ wbsFilter.hide = e.target.checked; renderWbs(); }
});

document.getElementById("btnExport").addEventListener("click", () => openSheet("export"));
document.getElementById("btnImport").addEventListener("click", () => openSheet("import"));
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !sheet.hidden) closeSheet(); });

document.getElementById("sheetAction").addEventListener("click", async () => {
  if(sheetMode === "export"){
    const ok = await copyText(sheetText.value);
    toast(ok ? "Đã sao chép mã tiến độ" : "Không sao chép được — hãy chọn và copy thủ công");
  }else{
    const res = decode(sheetText.value);
    if(!res){ toast("Mã không hợp lệ — phải bắt đầu bằng B4v1:"); return; }
    if(res.mismatch){
      toast(`Mã có ${res.digits.length} mục, bảng cần ${TASKS.length} — bản mã khác phiên bản`);
      return;
    }
    const n = mergeDigits(res.digits);
    closeSheet();
    renderAll();
    toast(n ? `Đã gộp ${n} mục tiến độ` : "Không có mục nào mới để gộp");
  }
});

document.getElementById("btnReset").addEventListener("click", () => {
  state = {}; nrDone = {};
  save();
  renderAll();
  toast("Đã đặt lại toàn bộ tiến độ");
});

/* ============ KHỞI ĐỘNG ============ */
load();
renderAll();
syncTabsTop();
window.addEventListener("resize", syncTabsTop);
</script>
